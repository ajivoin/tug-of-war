name: Lint

on:
  push:
    branches: [ main ]
    paths:
    - '**.ts'
    - '**.js'
    - '**.json'
  pull_request:
    branches: [ main ]
    paths:
    - '**.ts'
    - '**.js'
    - '**.json'

jobs:
  lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: npm
    - run: npm ci
    - run: npm run lint
    - run: npm run typecheck
    - run: npm test
